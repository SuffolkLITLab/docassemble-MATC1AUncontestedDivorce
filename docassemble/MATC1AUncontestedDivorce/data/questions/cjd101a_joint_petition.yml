---
id: a_divorce
continue button field: cjd101a_joint_petition_intro
question: |
  1a_divorce
subquestion: |
  This interview will help you jointly ask the court for an uncontested, no-fault divorce.
  
  Before you get started, please gather:
  
  1. Marriage certificate
  2. 
  
  
  When you are finished, you will need to:
  
  1. Step
  2. Steps

  If you are married, you can use this interview to jointly ask the court for an uncontested, no-fault divorce.

  Most people take about 60 minutes to complete this interview.
---
id: Confirm Purpose Jurisdiction
question: |
  Confirm Purpose & Jurisdiction
fields:
  - "My spouse and I want to file for an uncontested divorce together": confirm_purpose
    datatype: yesno
  - "Are you and your spouse legally married?": married
    datatype: yesno
---
id: Marriage Information
question: |
  Marriage Information
fields:
  - "Marriage location (city & state, include country if outside USA)": marriage_place
    maxlength: 54
  - "Date of marriage": marriage_date
    datatype: date
  - "Where did petitioners last live together?": petitioners_last_living_together_place
    maxlength: 40
  - "When did petitioners last live together?": petitioners_last_living_together_date
    datatype: date
  - "Date of marriage breakdown": marriage_breakdown_date
    datatype: date
  - "Petitioners2 addres zip": petitioners2_addres_zip
    maxlength: 11
---
id: Name Change s
question: |
  Name Change(s)
subquestion: |
  NAME CHANGE RULE INFORMATION HERE (?)
fields:
  - "Change petitioners1 name": change_name_petitioners1
    datatype: yesno
  - "Petitioners1 former name": petitioners1_former_name
    maxlength: 48
  - "Change petitioners2 name": change_name_petitioners2
    datatype: yesno
  - "Petitioners2 former name": petitioners2_former_name
    maxlength: 48
---
id: Children
question: |
  Children
fields:
  - "Child 2, Full name and birthdate:": children2_name_full_plus_birthdate
    maxlength: 39
    required: False
  - "Child 1, Full name and birthdate:": children1_name_full_plus_birthdate
    maxlength: 39
    required: False
  - "Child 3, Full name and birthdate:": children3_name_full_plus_birthdate
    maxlength: 39
    required: False
  - "Child 4, Full name and birthdate:": children4_name_full_plus_birthdate
    maxlength: 39
    required: False
---
id: Formal Requests
question: |
  Formal Requests
fields:
  - "Request no-fault divorce": request_divorce_nofault
    datatype: yesno
  - "Request separation agreement approval": request_separation_agreement_approval
    datatype: yesno
  - "Request Merge agreement": merge_agreement
    datatype: yesno
  - "Request Surivive agreement": surivive_agreement
    datatype: yesno
  - "Additional request": additional_request
    datatype: yesno
  - "Additonal request detail": additonal_request_detail
    maxlength: 84
---
id: Attorney Information
question: |
  Attorney Information
fields:
  - "Previous action detail": previous_action_detail
    input type: area
    maxlength: 252
    required: False
  - "Attorneys1 bbo number": attorneys1_bbo_number
    maxlength: 31
  - "Attorneys2 bbo number": attorneys2_bbo_number
    maxlength: 31
