  - cjd101a_joint_petition_attachment: ALDocument.using(title="1a_divorce", filename="cjd101a_joint_petition", enabled=True, has_addendum=False, )
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[cjd101a_joint_petition_Post_interview_instructions, cjd101a_joint_petition_attachment], filename="cjd101a_joint_petition", title="All forms to download for your records", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[cjd101a_joint_petition_attachment],  filename="cjd101a_joint_petition", title="All forms to deliver to court", enabled=True)
---
# Each attachment defines a key in an ALDocument. We use `i` as the placeholder here so the same template is 
# used for "preview" and "final" keys, and logic in the template checks the value of 
# `i` to show or hide the user's signature
attachment:
  name: Post-interview-Instructions
  filename: cjd101a_joint_petition_next_steps
  docx template file: cjd101a_joint_petition_next_steps.docx
  variable name: cjd101a_joint_petition_Post_interview_instructions[i]
  skip undefined: True
  tagged pdf: True
