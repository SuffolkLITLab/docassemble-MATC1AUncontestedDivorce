---
id: 1A Divorce Agreement
question: |
  1A Divorce Agreement
continue button field: A_Divorce_Agreement
---
id: Children
question: |
  Children
fields:
  - "You and your spouse have no children together who are minors or dependents": has_no_children
    datatype: yesno
  - "Do you and your spouse have any unemancipated  children together?": has_children
    datatype: yesno
  - "What is your child's first name?": children1_name_first
  - "What is your child’s date of birth?": children1_birthdate
    datatype: date
---
id: Child Custody and Parenting Time
question: |
  Child Custody and Parenting Time
fields:
  - "Do you have custom terms for custody?": custody_custom_terms
    datatype: yesno
  - "Describe the parenting time arrangement": parenting_time_description
  - "Have you and your spouse agreed to share legal custody, but have one parent be the main caretaker (physical custody)?": custody_joint_legal_split_physical
    datatype: yesno
  - "Should all the child-related parts of your agreement (like custody, parenting time, and support) be changeable by the court in the future?": merge_child_issues
    datatype: yesno
  - "Have you and your spouse agreed that only one of you will have full legal and physical custody of the child or children?": custody_sole
    datatype: yesno
  - "The parties shall have joint legal and physical custody of the minor child(ren).": custody_joint_legal_physical
    datatype: yesno
  - "Which parent will have scheduled parenting time with the child or children?": parenting_time_recipient
    input type: dropdown
    choices:
      - Party A
      - Party B
  - "Which parent will the child(ren) live with most of the time?": physical_custody_holder
    input type: dropdown
    choices:
      - Party A
      - Party B
  - "Have you and your spouse made a separate schedule for parenting time, holidays, or vacations?": parenting_time_attached_schedule
  - "Does either Party want sole custody of the child(ren)?": sole_custody_holder
    input type: dropdown
    choices:
      - No
      - Party A
      - Party B
  - "What is the custody arrangement you agreed to?": custody_custom_description
  - "Have you and your spouse agreed on a parenting time schedule?": parenting_time_assigned
    datatype: yesno
---
id: Child Support
question: |
  Child Support
fields:
  - "Will child support be paid through a wage assignment handled by the Department of Revenue?": child_support_wage_assignment
    datatype: yesno
  - "Who will make child support payments?": child_support_payer
    input type: dropdown
    choices:
      - Party A
      - Party B
      - N/A
  - "Who will receive the child support payments?": child_support_recipient
    input type: dropdown
    choices:
      - Party A
      - Party B
      - N/A
  - "How much will be paid for child support?": child_support_amount_value
    datatype: currency
    min: 0
  - "How often will child support payments be made?": child_support_frequency
  - "If the full child support amount is not paid through wage assignment, please provide who will be making up the difference.": child_support_shortfall_payer
  - "Child support direct payment": child_support_direct_payment
  - "Who will pay child support?": child_support_applies_to
    input type: dropdown
    choices:
      - N/A
      - Party A
      - Party B
  - "Do you agree that child support will stop when the child turns 21?": child_support_ends_at_21
    datatype: yesno
  - "Are you and your spouse choosing a different child support amount than the state's suggested amount?": child_support_deviation
    datatype: yesno
  - "What is the weekly child support amount calculated by the Massachusetts Child Support Guidelines?": child_support_guideline_amount
    datatype: currency
    min: 0
  - "Why are you agreeing to a different child support amount?": child_support_deviation_reason
---
id: Education and Extracurriculars Children
question: |
  Education and Extracurriculars (Children)
fields:
  - "Do you and your pouse agree to contribute to the child(ren)'s college or trade school costs based on what each of you can afford?": education_cost_based_on_ability
    datatype: yesno
  - "Do you have custom terms for education?": education_custom_terms
    datatype: yesno
  - "How will you divide the cost of college or trade school after high school?": education_custom_description
  - "Do you have custom terms for extracurriculars?": extracurricular_custom_terms
    datatype: yesno
  - "Extracurricular description": extracurricular_description
---
id: Health Insurance
question: |
  Health Insurance
fields:
  - "Will each of you be responsible for your own health insurance?": health_insurance_self_responsible
    datatype: yesno
  - "If there is an extra cost to keep one spouse on the other's health insurance, have you agreed that the coverage can continue as long as someone pays the added cost?s": health_insurance_with_cost_allowed
    datatype: yesno
  - "Which spouse will provide health insurance for the other?": health_insurance_provider_adult
    input type: dropdown
    choices:
      - Party A
      - Party B
      - N/A
  - "What type of health insurance will be provided for the other spouse?": health_insurance_types_adult
    datatype: checkboxes
    choices:
      - Medical
      - Dental
      - Vision
  - "Type": type
  - "Who will get the health insurance coverage from the other spouse?": health_insurance_recipient_adult
    input type: dropdown
    choices:
      - Party A
      - Party B
  - "If there’s an extra cost to keep one spouse on health insurance, who will pay that extra cost?": health_insurance_cost_payer_adult
    input type: dropdown
    choices:
      - Party A
      - Party B
      - N/A
  - "Will each of you be responsible for paying your own uninsured medical, dental, and vision expenses?": uninsured_expenses_self_responsible
    datatype: yesno
  - "Do you have custom terms for either Party's health insurance coverage?": health_insurance_custom_terms_adult
    datatype: yesno
  - "What are the specific details of the health insurance agreement between you and your spouse?": health_insurance_custom_description_adult
  - "Who will provide health insurance for the children?": health_insurance_provided_for_children
    input type: dropdown
    choices:
      - Party A
      - Party B
  - "Which parent will provide health insurance for the child or children?": health_insurance_provider_children
    input type: dropdown
    choices:
      - Party A
      - Party B
  - "What type(s) of health insurance will be provided for the children?": health_insurance_types_children
    input type: dropdown
    choices:
      - MassHealth
      - Private Plan
  - "How long will health insurance be provided for the children?": health_insurance_until
  - "Will you and your spouse split the cost of your children’s uninsured medical or dental bills 50/50?": uninsured_expenses_split_children
    datatype: yesno
  - "Do you have custom terms for the child(ren)'s health insurance?": health_insurance_custom_terms_children
    datatype: yesno
  - "What is the agreement for the child(ren)'s health insurance coverage?": health_insurance_custom_description_children
---
id: Alimony
question: |
  Alimony
fields:
  - "Have both you and your spouse agreed to give up any right to receive alimony now or in the future?": alimony_waived_all
    datatype: yesno
  - "One party will pay alimony to the other": alimony_payment_agreed
    datatype: yesno
  - "Who will be paying alimony?": alimony_payer
    input type: dropdown
    choices:
      - Party A
      - Party B
      - N/A
  - "Who will receive alimony payments?": alimony_recipient
    input type: dropdown
    choices:
      - Party A
      - Party B
      - N/A
  - "Alimony amount value": alimony_amount_value
    datatype: currency
    min: 0
  - "How often will alimony payments be made?": alimony_frequency
  - "What day will alimony payments be due?": alimony_due_on
    input type: dropdown
    choices:
      - Every Friday
      - First day of each month
  - "f alimony will end on a specific date (not just when someone remarries or passes away), what is that date?": alimony_end_date
    datatype: date
  - "Past and present alimony is waived. Future alimony is not waived.": alimony_waived_future_only
    datatype: checkboxes
    choices:
      - None
  - "What is your alimony agreement?": alimony_custom_description
---
id: Taxes
question: |
  Taxes
fields:
  - "Have you and your spouse agreed to file your taxes separately from now on?": taxes_file_separately
    datatype: yesno
  - "Tax debt responsibility set": tax_debt_responsibility_set
  - "Who will be responsible for any unpaid tax debt?": tax_debt_responsible_party
    input type: dropdown
    choices:
      - Party A
      - Party B
      - N/A
  - "Have you and your spouse both filed and paid all your taxes during the marriage?": taxes_fully_reported
    datatype: yesno
  - "Do you have custom terms for taxes?": taxes_custom_terms
    datatype: yesno
  - "What is your agreement for taxes?": taxes_custom_description
  - "Have you agreed that one parent will claim the child or children on taxes every year? If yes, which parent?": child_tax_claim_single_party
    input type: dropdown
    choices:
      - Party A
      - Party B
      - N/A
  - "Which parent will claim the child(ren) on their taxes every year?": child_tax_single_party
    input type: dropdown
    choices:
      - Party A
      - Party B
  - "Have you agreed that each of you will take turns claiming the child or children on taxes in alternating years?": child_tax_claim_split_years
    datatype: yesno
  - "Which parent will claim the child or children on their taxes in odd-numbered years?": child_tax_odd_year_party
    input type: dropdown
    choices:
      - Party A
      - Party B
      - N/A
  - "Which parent will claim the child or children on their taxes in even-numbered years?": child_tax_even_year_party
    input type: dropdown
    choices:
      - Party A
      - Party B
      - N/A
  - "Do you have custom terms for claiming the child(ren) on taxes?": child_tax_claim_custom_terms
    datatype: yesno
  - "What custom agreement have you made about who will claim the child or children on tax returns?": child_tax_claim_custom_description
---
id: Marital Property
question: |
  Marital Property
fields:
  - "Do you and your spouse own any real estate together or separately?": no_real_estate
    datatype: yesno
  - "Have you and your spouse agreed that one of you will keep a piece of real estate as part of the divorce?": real_estate_transfer
    datatype: yesno
  - "Who will keep the real estate property?": real_estate_owner_name
    input type: dropdown
    choices:
      - N/A
      - Party A
      - Party B
  - "What is the full address of the real estate property involved in your agreement?": real_estate_address
  - "Whose name is currently on the deed for the real estate property?": real_estate_current_owner
    input type: dropdown
    choices:
      - Party A
      - Party B
      - N/A
  - "What county is the real estate property located in?": real_estate_county
    input type: dropdown
    choices:
      - Barnstable
      - Bristol
      - Essex
      - Middlesex
      - Suffolk
  - "What is the book number where the deed for the real estate is recorded?": real_estate_book
  - "What is the page number in the Registry of Deeds where the real estate is recorded?": real_estate_page
  - "Is a party waiving interest in the property?": real_estate_waiver_party
    input type: dropdown
    choices:
      - No
      - Party A
      - Party B
  - "Who will be responsible for paying the costs and expenses for the real estate?": real_estate_cost_responsible
    input type: dropdown
    choices:
      - Party A
      - Party B
  - "When will the person taking over the property start being responsible for its costs?": real_estate_start_date
    datatype: date
  - "Do you have custom terms for real estate?": real_estate_custom_terms
    datatype: yesno
  - "Real estate custom description": real_estate_custom_description
  - "Personal property already divided": personal_property_already_divided
  - "Do you and your spouse have a plan for how to divide your personal property?": personal_property_divide_plan
  - "Date of Personal property divide": personal_property_divide_date
    datatype: date
  - "What special terms have you and your spouse agreed to about real estate?": personal_property_divide_description
---
id: Debts and Liabilities
question: |
  Debts and Liabilities
fields:
  - "Do you and your spouse agree that you have no shared debts from the marriage?": no_marital_debt
    datatype: yesno
  - "Will each of you be responsible for paying the debts that are in your own name?": individual_debt_responsible_each
    datatype: yesno
  - "Does Party A have any debts or liabilities they will be responsible for?": users[0].debt_listed
    datatype: yesno
  - "What debts and liabilities will Party A be responsible for?": users[0].debt_description
  - "Does Party B have any debts or liabilities?": other_parties[0].debt_listed
    datatype: yesno
  - "If Party B has debts and liabilities, what are they?": other_parties[0].debt_description
  - "Do you have custom terms for debt?": debt_custom_terms
    datatype: yesno
  - "What is your agreement for debts and liabilities?": debt_custom_description
---
id: Pension and Retirement Plans
question: |
  Pension and Retirement Plans
fields:
  - "The parties have no retirement or pension benefits to be divided": no_retirement_benefits
    datatype: yesno
  - "Have you and your spouse agreed to give up any right to each other’s retirement or pension benefits?": retirement_interest_waived
    datatype: yesno
  - "Have you and your spouse agreed to divide any retirement or pension benefits?": retirement_benefits_divided
    datatype: yesno
  - "How will you and your spouse divide any retirement or pension benefits?": retirement_division_description
---
id: Life Insurance
question: |
  Life Insurance
fields:
  - "Do you and your spouse currently have no life insurance policies?": no_life_insurance
    datatype: yesno
  - "Will Party A keep their current life insurance and name the children (or a trust for the children) as the beneficiaries?": users1_life_insurance_required
    datatype: yesno
  - "Will Party B shall maintain in full force and effect their present life insurance on their life, with the child(ren) of the parties, or a trust for the benefit of the child(ren) of the parties, as beneficiary?": other_parties1_life_insurance_required
    datatype: yesno
  - "Do you have custom terms for life insurance?": life_insurance_custom_terms
    datatype: yesno
  - "What special terms have you and your spouse agreed to about life insurance?": life_insurance_custom_description
---
id: Merger Survival
question: |
  Merger/Survival
fields:
  - "Do you want all parts of the agreement to be modifiable by the court in the future, except for property and debts?": agreement_merge_fully
    datatype: yesno
  - "Do you want this agreement to stay as a separate contract that the court can’t change later, except in rare cases?": agreement_merge_none
    datatype: yesno
  - "Do you want only some parts of this agreement to be changeable by the court in the future, while the rest stays final?": agreement_merge_partial
    datatype: yesno
  - "Should the health insurance terms in your agreement be changeable by the court in the future?": merge_health_insurance
    datatype: yesno
  - "Should the alimony terms in your agreement be changeable by the court in the future?": merge_alimony
    datatype: yesno
  - "What other parts of your agreement should be changeable by the court in the future?": merge_other_description
---
id: Initials
question: |
  Initials
fields:
  - "What are Party A’s initials?": users1_initials
    input type: area
  - "Other parties1 initials": other_parties1_initials
    input type: area
