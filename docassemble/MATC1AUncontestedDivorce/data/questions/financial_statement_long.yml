id: long_certification
sets:
  - long_certification
continue button field: long_certification
question: |
  Certification
fields:
  - Signature: user_signature
    required: False
  - Signature date: user_signature_date
    datatype: date
    required: False
---
id: long_notary
sets:
  - long_notary
continue button field: long_notary
question: |
  Notary
fields:
  - Will you have this notarized now?: will_notarize_now
    datatype: yesno
  - County: notary_county
    show if:
      variable: will_notarize_now
      is: True
    required: False
  - Date of appearance: notary_appearance_date
    show if:
      variable: will_notarize_now
      is: True
    datatype: date
    required: False
  - Notary public name: notary_name
    show if:
      variable: will_notarize_now
      is: True
    required: False
  - Commission expires: notary_commission_expires
    show if:
      variable: will_notarize_now
      is: True
    required: False
