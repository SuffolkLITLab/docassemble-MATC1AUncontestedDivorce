---
modules:
  - docassemble.base.util
---
id: long_form_sections
sets:
  - long_form_sections
code: |
  long_deductions
  long_net_income
  long_prior_year
  long_expenses_part_1
  long_expenses_part_2
  long_expenses_part_3
  long_expenses_total
  long_counsel_fees
  long_real_estate_primary
  long_real_estate_secondary
  motor_vehicles.gather()
  pensions.gather()
  other_assets.gather()
  long_assets_total
  liabilities.gather()
  long_liabilities_total
  long_certification
  long_notary
  attorney_statement
  long_form_sections = True
---
id: long_deductions
sets:
  - long_deductions
continue button field: long_deductions
question: |
  Weekly deductions from gross income
subquestion: |
  Enter amounts using your chosen cadence (${ financial_cadence_default }).
fields:
  - Federal tax withholding/estimated payments: long_deduction_federal
    datatype: currency
    required: False
  - Federal withholding allowances claimed: long_federal_allowances
    datatype: integer
    required: False
    min: 0
  - State tax withholding/estimated payments: long_deduction_state
    datatype: currency
    required: False
  - State withholding allowances claimed: long_state_allowances
    datatype: integer
    required: False
    min: 0
  - F.I.C.A.: long_deduction_fica
    datatype: currency
    required: False
  - Medicare: long_deduction_medicare
    datatype: currency
    required: False
  - Medical insurance: long_deduction_medical
    datatype: currency
    required: False
  - Dental insurance: long_deduction_dental
    datatype: currency
    required: False
  - Vision insurance: long_deduction_vision
    datatype: currency
    required: False
  - Union dues: long_deduction_union
    datatype: currency
    required: False
  - Child support: long_deduction_child_support
    datatype: currency
    required: False
  - Spousal support: long_deduction_spousal_support
    datatype: currency
    required: False
  - Retirement: long_deduction_retirement
    datatype: currency
    required: False
  - Savings: long_deduction_savings
    datatype: currency
    required: False
  - Deferred compensation: long_deduction_deferred_comp
    datatype: currency
    required: False
  - Credit union (loan): long_deduction_credit_union_loan
    datatype: currency
    required: False
  - Credit union (savings): long_deduction_credit_union_savings
    datatype: currency
    required: False
  - Charitable contributions: long_deduction_charity
    datatype: currency
    required: False
  - Life insurance: long_deduction_life_insurance
    datatype: currency
    required: False
  - Other (specify): long_deduction_other_description
    required: False
  - Other amount: long_deduction_other_amount
    datatype: currency
    required: False
---
code: |
  long_deductions_total_weekly = (
    to_weekly(value("long_deduction_federal"), financial_cadence_default)
    + to_weekly(value("long_deduction_state"), financial_cadence_default)
    + to_weekly(value("long_deduction_fica"), financial_cadence_default)
    + to_weekly(value("long_deduction_medicare"), financial_cadence_default)
    + to_weekly(value("long_deduction_medical"), financial_cadence_default)
    + to_weekly(value("long_deduction_dental"), financial_cadence_default)
    + to_weekly(value("long_deduction_vision"), financial_cadence_default)
    + to_weekly(value("long_deduction_union"), financial_cadence_default)
    + to_weekly(value("long_deduction_child_support"), financial_cadence_default)
    + to_weekly(value("long_deduction_spousal_support"), financial_cadence_default)
    + to_weekly(value("long_deduction_retirement"), financial_cadence_default)
    + to_weekly(value("long_deduction_savings"), financial_cadence_default)
    + to_weekly(value("long_deduction_deferred_comp"), financial_cadence_default)
    + to_weekly(value("long_deduction_credit_union_loan"), financial_cadence_default)
    + to_weekly(value("long_deduction_credit_union_savings"), financial_cadence_default)
    + to_weekly(value("long_deduction_charity"), financial_cadence_default)
    + to_weekly(value("long_deduction_life_insurance"), financial_cadence_default)
    + to_weekly(value("long_deduction_other_amount"), financial_cadence_default)
  )
---
id: long_net_income
continue button field: long_net_income
question: |
  Net weekly income
subquestion: |
  Total gross weekly income: ${ currency(income_total_weekly) }

  Total weekly deductions: ${ currency(long_deductions_total_weekly) }

  Net weekly income: ${ currency(income_total_weekly - long_deductions_total_weekly) }
---
code: |
  long_net_weekly_income = income_total_weekly - long_deductions_total_weekly
---
id: long_prior_year
sets:
  - long_prior_year
continue button field: long_prior_year
question: |
  Prior year income
fields:
  - Gross income from prior year: prior_year_gross_amount
    datatype: currency
    required: False
  - Number of years paid into Social Security: years_paid_into_social_security
    datatype: integer
    required: False
    min: 0
