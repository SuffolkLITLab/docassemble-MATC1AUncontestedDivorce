code: |
  def _long_expense_weekly(source_key):
    try:
      total = 0
      for item in long_expense_list:
        if hasattr(item, 'source') and item.source == source_key:
          total += item.total(times_per_year=52) if hasattr(item, 'total') else 0
      return total
    except:
      return 0
