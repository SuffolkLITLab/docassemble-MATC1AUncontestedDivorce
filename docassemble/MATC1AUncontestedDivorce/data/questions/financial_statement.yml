---
modules:
  - docassemble.base.util
---
include:
  - docassemble.AssemblyLine:assembly_line.yml
  - docassemble.ALMassachusetts:al_massachusetts.yml
  - docassemble.MassAccess:massaccess.yml
  - docassemble.ALToolbox:al_income.yml
  - financial_statement_shared.yml
  - financial_statement_short.yml
  - financial_statement_long.yml
  - financial_statement_schedule_a.yml
  - financial_statement_schedule_b.yml
---
metadata:
  title: |
    Financial Statement (MA Probate and Family Court)
  short title: |
    Financial Statement
  description: |
    This interview helps you prepare a Massachusetts financial statement for Probate and Family Court.
    You will answer questions about your income, expenses, assets, and debts.
  before_you_start: |
    Before you begin, gather what you have available:
    - Recent pay stubs or benefit letters
    - Recent bills and recurring expense statements
    - Account balances for assets and debts

    If you are not sure of an amount, use your best good-faith estimate.

    If you see a green phrase like "gross annual income," tap it to see a definition.
  estimated_completion_minutes: 30
  estimated_completion_delta: 10
  LIST_topics:
    - Family law
    - Financial disclosure
  authors:
    - Court Forms Online
  jurisdiction: NAM-US-US+MA
  landing_page_url: https://courtformsonline.org/
  typical_role: plaintiff
  maturity: draft
---
initial: True
code: |
  interview_short_title = "Financial Statement (MA Probate and Family Court)"
---
code: |
  allowed_courts = ["Probate and Family Court"]
---
code: |
  enable_al_nav_sections = True
  al_nav_sections = [
    "Introduction",
    "Eligibility",
    "Court and parties",
    "Personal information",
    "Cadence",
    "Income",
    "Deductions",
    "Expenses",
    "Assets",
    "Liabilities",
    "Review",
    "Download",
  ]
---
objects:
  - users: ALPeopleList.using(target_number=1)
  - other_parties: ALPeopleList.using(target_number=1)
  - trial_court: MACourt
---
objects:
  - fs_short: ALDocument.using(title="Financial Statement (Short Form)", filename="financial_statement_short", enabled=True, has_addendum=False)
  - fs_long: ALDocument.using(title="Financial Statement (Long Form)", filename="financial_statement_long", enabled=True, has_addendum=False)
  - fs_schedule_a: ALDocument.using(title="Schedule A - Self-Employment Income", filename="financial_statement_schedule_a", enabled=True, has_addendum=False)
  - fs_schedule_b: ALDocument.using(title="Schedule B - Rental Income", filename="financial_statement_schedule_b", enabled=True, has_addendum=False)
  - al_user_bundle: ALDocumentBundle.using(elements=[fs_short, fs_long, fs_schedule_a, fs_schedule_b], filename="financial_statement", title="All financial statement forms for your records", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[fs_short, fs_long, fs_schedule_a, fs_schedule_b], filename="financial_statement", title="All financial statement forms for the court", enabled=True)
---
code: |
  fs_short.enabled = financial_form_type == "short"
  fs_long.enabled = financial_form_type == "long"
  fs_schedule_a.enabled = defined("has_self_employment_income") and has_self_employment_income
  fs_schedule_b.enabled = defined("has_rental_income") and has_rental_income
---
sections:
  - review_fs: Review your answers
---
mandatory: True
code: |
  al_intro_screen
  interview_order_financial_statement
---
id: interview_order_financial_statement
code: |
  nav.set_sections(al_nav_sections)
  nav.set_section("Introduction")
  set_progress(5)
  fs_intro

  nav.set_section("Eligibility")
  set_progress(15)
  gross_annual_income
  financial_form_type

  nav.set_section("Court and parties")
  set_progress(25)
  trial_court
  docket_number
  users[0].name.first
  other_parties[0].name.first

  nav.set_section("Personal information")
  set_progress(35)
  users[0].birthdate
  users[0].phone_number
  users[0].address.address
  user_employer_name
  if user_employer_name or user_job_title:
    user_employer_address_street
  user_has_health_insurance

  nav.set_section("Cadence")
  set_progress(45)
  financial_cadence_default

  nav.set_section("Income")
  set_progress(55)
  income_list.gathered
  income_schedule_triggers

  if has_self_employment_income:
    schedule_a_sections
  if has_rental_income:
    schedule_b_sections
  income_totals
  if income_total_weekly == 0:
    need("confirm_no_income")

  if financial_form_type == "short":
    short_form_sections
  else:
    long_form_sections

  nav.set_section("Review")
  set_progress(95)
  fs_review

  nav.set_section("Download")
  set_progress(100)
  fs_download

  interview_order_financial_statement = True
---
id: financial_form_type
code: |
  if gross_annual_income >= 75000:
    financial_form_type = "long"
  else:
    financial_form_type = "short"
---
code: |
  def _income_weekly(source_key):
    try:
      total = 0
      for item in income_list:
        if hasattr(item, 'source') and item.source == source_key:
          total += item.total(times_per_year=52) if hasattr(item, 'total') else 0
      return total
    except:
      return 0

  fs_income_wages = _income_weekly("wages")
  fs_income_overtime = _income_weekly("overtime")
  fs_income_part_time = _income_weekly("part_time")
  fs_income_tips = _income_weekly("tips")
  fs_income_commissions = _income_weekly("commissions")
  fs_income_dividends = _income_weekly("dividends")
  fs_income_trusts = _income_weekly("trusts")
  fs_income_pensions = _income_weekly("pensions")
  fs_income_social_security = _income_weekly("social_security")
  fs_income_disability = _income_weekly("disability")
  fs_income_public_assistance = _income_weekly("public_assistance")
  fs_income_support_received = _income_weekly("support_received")
  fs_income_royalties = _income_weekly("royalties")
  fs_income_household_contrib = _income_weekly("household_contrib")
  fs_income_other = _income_weekly("other")
---
code: |
  def _to_weekly_safe(var_name):
    try:
      amt = value(var_name) if defined(var_name) else 0
      return to_weekly(amt, financial_cadence_default) if amt else 0
    except:
      return 0

  def _short_expense_weekly(source_key):
    try:
      total = 0
      for item in expense_list:
        if hasattr(item, "source") and item.source == source_key:
          total += item.total(times_per_year=52) if hasattr(item, "total") else 0
      return total
    except:
      return 0
