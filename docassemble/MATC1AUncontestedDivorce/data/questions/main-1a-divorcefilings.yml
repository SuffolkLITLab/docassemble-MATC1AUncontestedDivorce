id: Agreement status
question: |
  Agreement on major issues
subquestion: |
  Do ${  users[0].name_full()  } and ${  users[1].name_full()  } agree on how to resolve the major issues, such as property division, child custody, and child support?

  *Note:* Many married couples begin the joint no-fault (1A) divorce process by writing a separation agreement (on their own or with the help of attorneys). A separation agreement is not required at the time of filing for divorce but it is highly encouraged to submit a complete, notarized agreement with initial filing.
fields: 
  - "We agree on the major issues": separation_agreement_reached
    datatype: yesnoradio
  - "We have prepared a detailed written separation agreement that fully captures our agreement on all relevant issues": separation_agreement_documented
    datatype: yesnoradio
    show if: separation_agreement_reached
    help: |
      If you do not already have a complete written separation agreement you will be able to create one using this interview tool.
---
id: Separation agreement format
question: |
  Separation agreement format
subquestion: |
  Anyone filing a joint petition for divorce must file a separation agreement within 90 days of initial filing. The separation agreement must be notarized and should completely address all major issues such as property division, child custody, and child support. You are highly encouraged to submit a complete, notarized agreement with initial filing. 
fields: 
  - "How would you like to file your separation agreement?": separation_agreement_format
    input type: radio
    choices: 
      - "Upload my complete, notarized separation agreement here": upload
        show if: separation_agreement_documented
      - "File my complete, notarized separation agreement with the registry later" : wait
      - "Create a separation agreement using this interview tool": interview
        show if: separation_agreement_documented == False
---
