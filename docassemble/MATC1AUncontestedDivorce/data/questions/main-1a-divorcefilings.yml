fields:
  - "Attorneys1 bbo number": attorneys1_bbo_number
    maxlength: 31
  - "Attorneys2 bbo number": attorneys2_bbo_number
    maxlength: 31
  - "Do you have a lawyer?": petitioners1_has_attorney
    datatype: yesno
  - "Is your spouse represented by a lawyer?": petitioners2_has_attorney
    datatype: yesno
---
id: Screen six
