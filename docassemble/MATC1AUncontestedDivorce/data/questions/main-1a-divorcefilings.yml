    for u in users:
      u.address.address = marital_home.address
      u.address.unit = marital_home.unit
      u.address.city = marital_home.city
      u.address.state = marital_home.state
      u.address.zip = marital_home.zip
      u.address.county = marital_home.county
---
#decide venue 
code: |
  mh_county = marital_home.county
  u0_county = users[0].address.county
  u1_county = users[1].address.county

  if (u0_county == mh_county) or (u1_county == mh_county):
    venue_county = mh_county
    venue_needs_choice = False
  else:
    venue_needs_choice = True
    venue_choice
    venue_county = users[int(venue_choice)].address.county
