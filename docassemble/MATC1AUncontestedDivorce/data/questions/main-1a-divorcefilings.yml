#################### Interview order #####################
comment: |
  Controls order and branching logic for questions specific to this form
id: interview_order_divorcefilings
code: |
  # Set the allowed courts for this interview
  allowed_courts = ['Probate and Family Court']
  nav.set_section("review_divorcefilings")
  user_role = "plaintiff"
  user_ask_role = "plaintiff"
  is_agent
  if is_agent == True:
    agent_guidance
  legal_marriage
  if legal_marriage == False:
    purpose_mismatch
  massachusetts_residency
  if massachusetts_residency == False:
    purpose_mismatch
  petition_is_joint
  if petition_is_joint == False:
    purpose_mismatch
  separation_agreement_reached
  if separation_agreement_reached == False:
    purpose_mismatch
  separation_agreement_format
  if separation_agreement_format == "wait":
    cautionary_validation_message
  marriage_date
  live_together
  marital_home.address
  users[0].name_change
  request_merge_agreement
  previous_action
  if previous_action == True:
    previous_action_detail
  additional_request
  children_of_marriage
  if not children_of_marriage:
    children_of_marriage_number = 0
  if children_of_marriage:
    children_of_marriage_number
  users.gather()
  if children_of_marriage:
    children.gather()
  set_progress(90)
  interview_order_divorcefilings = True
