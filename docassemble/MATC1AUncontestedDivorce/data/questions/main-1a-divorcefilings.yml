id: Uncontested_Divorce_Joint_Petition
continue button field: divorcefilings_intro
question: |
  Uncontested Divorce Joint Petition
subquestion: |
  This interview will help you ask the court for a joint, uncontested divorce.
  
  Before you get started, please gather:
  
  1. Marriage certificate
  2. 
  3. 
  
  When you are finished, you will need to:
  
  1. 
  2.

  If you are married, you can use this interview to jointly request an uncontested divorce.

  Most people take about 60 minutes to complete this interview.
---
id: Purpose Screen 
question: | 
  Are you using this interview to ask the Massachusetts court for a divorce?
yesno: purpose_is_divorce
---
id: Purpose Screen Offramp
event: purpose_mismatch
question: |
  This interview is only for legally married couples jointly filing for an uncontested, no-fault divorce in Massachusetts. 
Subquestion: |
  Include Links to Resources Here
buttons: 
  - Exit: exit
---
id: Identity Screen
question: | 
  Are you completing this interview for yourself (including your spouse) or for someone else? 
field: is_agent
buttons: 
  - Myself/Ourselves: False
  - Someone Else: True
---
id: Identity Clarification
event: agent_guidance
question: |
  Respond to any questions phrased with "you" as if you are the person for whom you are completing this interview.
buttons: 
  - Continue: continue
---
id: Party A Name
question: |
  What is your name?
fields:
  - First: users[0].name.first
  - Middle: users[0].name.middle
    required: False
  - Last: users[0].name.last
  - Suffix: users[0].name.suffix
    code: |
      name_suffix()
    required: False
---
id: Party B Name
question: |
  What is your spouse's name?
fields:
  - First: users[1].name.first
  - Middle: users[1].name.middle
    required: False
  - Last: users[1].name.last
  - Suffix: users[1].name.suffix
    code: |
      name_suffix()
    required: False
---
id: Marriage Screen
question: |
  Are ${  users[0].name.full()  } and ${  users[1].name.full()  } legally married?
yesno: legal_marriage
---
id: Divorce Type Screen
question: |
  Do ${  users[0].name.full()  } and ${  users[1].name.full()  } both agree that you both:
  (1) want to get divorced and 
  (2) that you want file together?
yesno: petition_is_joint
---
id: Agreement Screen
question: |
  Have you and your spouse reached agreement on most or all of the major issues, such as property division, child custody, and child support?
yesnoradio: separation_agreement_reached
---
id: Confirm Jurisdiction
question: |
  Confirm Jurisdiction
fields:
  - "Have one or both spouses lived in Massachusetts for at least one year?": massachusetts_residency
    datatype: yesno
  - "Did the cause of the breakdown of the marriage occur in Massachusetts?": breakdown_in_massachusetts
    datatype: yesno
---
id: Relationship Background
question: |
  Relationship Background
fields:
  - "When did the marriage breakdown occur?": marriage_breakdown_date
    datatype: date
  - "Briefly explain what caused the marriage breakdown": marriage_breakdown_justification
    input type: area
    maxlength: 810
  - "Where were you married?": marriage_location
    maxlength: 54
  - "When were you married?": marriage_date
    datatype: date
---
id: Living Arrangements
question: |
  Living Arrangements
fields: 
  - "Are you and your spouse currently living together?": live_together
    datatype: yesnoradio
  - "When did you last live together?": petitioners_last_living_together_date
    datatype: date
  - "Where did you last live together? (County)": petitioners_last_living_together_location
    input type: radio
    choices:
      - Barnstable
      - Berkshire
      - Bristol
      - Dukes
      - Essex
      - Franklin
      - Hampden
      - Hampshire
      - Middlesex
      - Nantucket
      - Norfolk
      - Plymouth
      - Suffolk
      - Worcester
      - Outside of Massachusetts
---
id: Children
question: |
  Children
fields:
  - "Children2 name full plus birthdate": children2_name_full_plus_birthdate
    maxlength: 39
  - "Children1 name full plus birthdate": children1_name_full_plus_birthdate
    maxlength: 39
  - "Children3 name full plus birthdate": children3_name_full_plus_birthdate
    maxlength: 39
  - "Children4 name full plus birthdate": children4_name_full_plus_birthdate
    maxlength: 39
  - "Petitioners1 number of custodial children": petitioners1_number_of_custodial_children
    maxlength: 10
  - "Petitioners2 number of custodial children": petitioners2_number_of_custodial_children
    maxlength: 10
  - "Children of marriage number": children_of_marriage_number
    maxlength: 14
  - "R408 addendum": r408_addendum
    input type: area
    maxlength: 425
  - "Do you have any children of this marriage?": children_of_marriage
    datatype: yesno
  - "How many children of this marriage?": children_of_marriage_numnber
    datatype: integer
    min: 0
---
id: requests
question: |
  requests
fields:
  - "Previous action(s) detail": previous_action_detail
    input type: area
    maxlength: 252
  - "Request divorce nofault": request_divorce_nofault
    datatype: yesno
  - "Request separation agreement approval": request_separation_agreement_approval
    datatype: yesno
  - "Request merge agreement": request_merge_agreement
    datatype: yesno
  - "Request survive agreement": request_survive_agreement
    datatype: yesno
  - "Change name petitioners1": change_name_petitioners1
    datatype: yesno
  - "Petitioners1 former name last": petitioners1_former_name_last
    maxlength: 48
  - "Change name petitioners2": change_name_petitioners2
    datatype: yesno
  - "Petitioners2 former name last": petitioners2_former_name_last
    maxlength: 48
  - "Additional request": additional_request
    datatype: yesno
  - "Additonal request detail": additonal_request_detail
    maxlength: 84
  - "Petitioners1 name last upon divorce": petitioners1_name_last_upon_divorce
    maxlength: 26
  - "Petitioners2 name last upon divorce": petitioners2_name_last_upon_divorce
    maxlength: 26
---
id: Attorney Information
question: |
