continue button field: divorcefilings_intro
question: |
  Uncontested Divorce Joint Petition
subquestion: |
  This interview will help you ask the court for a joint no fault divorce in Massachusetts.
  
  Before you get started, gather:
    
  1. Marriage certificate
  2. Recent pay stub
  3. Budget or bills tracking
  4. Most recent tax year documents (Any and all Form 1099 and W2)

  When you are finished, you will need to:
    
  1. notarize separation agreement before filing with the registry
  2.


  Most people take about 60 minutes to complete this interview.
