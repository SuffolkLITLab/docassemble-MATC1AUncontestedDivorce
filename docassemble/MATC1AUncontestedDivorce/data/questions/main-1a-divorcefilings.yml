auto terms:
  children of the marriage: |
    Children of the marriage includes all children over whom the couple shares legal custody. This typically includes all children born to either spouse during the marriage and any other children legally adopted by one or both parents but not include step-children born or adopted to one spouse outside of the marriage and not legally adopted by the second spouse. 
  marital home: |
    The last residential address shared by divorcing parties
  notarize: |
    process where a notary public witnesses signatures and places a seal on document to ensure authenticity
  notarized: |
    a document that has been signed in the presence of a notary public and the notary has placed their seal upon it
  notary public: |
    a public officer authorized by law to administer oaths, certify documents, and perform other official duties
  divorce absolute: |
    The date a divorce becomes final
  alternative service: |
    A court allowed process to inform a party that a case has been started against them
  capias: |
    An arrest warrant issued by the judge 
  certificate of service: |
    Proof that the other parties have been notified of the pending case and received a copy of the motion or pleading that was filed 
  child support guidelines: |
    Mathematical formula used by the court to determine an appropriate amount of child support  
  financial statement: |
    A form summarizing a party's estimated income and expenses, assets, liabilities, and health insurance, etc. 
  notice of hearing: |
    A written notice to a party of the time, date, place, and reasoning for a court hearing 
  pretrial conference: |
    A hearing scheduled to resolve any issues the parties may have in order to prevent a trial. Trial may still be necessary if full resolution of the case cannot be established 
  separation agreement: |
    A written document listing all things the parties agree on in their divorce, like child support, taxes, parenting time, and property division
  service of process: |
    A document notifying the other party to the case that a legal procedure has started against them
  summons: |
    A notice to a party stating that a case was filed against them
  under advisement: |
    The judge is holding the case for further review before making a decision on the case 
#Source note: Most definitions in the section above from litigant "COMMONLY USED TECHNOLOGY" handout provided by the Suffolk Probate and Family Court Register
