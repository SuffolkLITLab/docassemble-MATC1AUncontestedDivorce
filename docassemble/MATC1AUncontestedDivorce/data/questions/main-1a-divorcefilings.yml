---
# ALDocument objects specify the metadata for each template
objects:
  - divorcefilings_Post_interview_instructions: ALDocument.using(title="Instructions", filename="divorcefilings_next_steps.docx", enabled=True, has_addendum=False)
  - affidirretrievablebreakdown: ALDocument.using(title="Affidirretrievablebreakdown", filename="affidirretrievablebreakdown", enabled=True, has_addendum=False, )
  - cjd101a: ALDocument.using(title="Cjd101a", filename="cjd101a", enabled=True, has_addendum=False, )
  - r408: ALDocument.using(title="R408", filename="r408", enabled=True, has_addendum=False, )
---
# Bundles group the ALDocuments into separate downloads, such as for court and for the user
objects:
  - al_user_bundle: ALDocumentBundle.using(elements=[divorcefilings_Post_interview_instructions, affidirretrievablebreakdown, cjd101a, r408], filename="divorcefilings", title="All forms to download for your records", enabled=True)
  - al_court_bundle: ALDocumentBundle.using(elements=[affidirretrievablebreakdown, cjd101a, r408],  filename="divorcefilings", title="All forms to deliver to court", enabled=True)
