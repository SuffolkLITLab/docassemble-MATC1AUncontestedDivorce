id: Uncontested_Divorce_Joint_Petition
continue button field: divorcefilings_intro
question: |
  Uncontested Divorce Joint Petition
subquestion: |
  This interview will help you ask the court for a joint, uncontested divorce
  
  Before you get started, please gather:
  
    1. Marriage certificate
    2. Recent pay stub
    3. Budget or bills tracking
    4. Most recent tax return

  When you are finished, you will need to:
  
  1. 
  2.

  If you are married, you can use this interview to jointly request an uncontested divorce.

  Most people take about 60 minutes to complete this interview.
---
id: Purpose screen offramp
event: purpose_mismatch
question: | 
  Joint (1A) Divorce Petition - Massachusetts
subquestion: |
  This interview is only for legally married couples jointly filing for an uncontested, no-fault divorce in Massachusetts. 

  Include Links to Resources Here. 
buttons: 
  - Exit: exit
---
id: Cautionary validation
continue button field: cautionary_validation_message
question: |
  Confirm information
subquestion: |
  You entered (insert information summary here) and (custom warning accordingly). Are you sure you want to proceed? Alternative you are allowed to proceed without doing ___, but are you really sure?
---
id: Identity screen
question: |
  Your role
subquestion: | 
  Are you completing this interview for yourself (including your spouse) or for someone else? 
field: is_agent
buttons: 
  - Myself/Ourselves: False
  - Someone Else: True
---
id: Identity language clarification
continue button field: agent_guidance
question: |
  Language clarification
subquestion: |
  The questions in this interview are written to help people prepare paperwork for their own use. If you are completing this interview for someone else, respond to questions phrased with "you" as if you are the person for whom you are completing this paperwork - more specifically one spouse of the couple seeking a divorce.
---
id: Legal marriage
question: |
  Legal marriage confirmation
subquestion: |
  Are ${  users[0].name.full()  } and ${  users[1].name.full()  } legally married?
yesno: legal_marriage
---
id: Confirm jurisdiction
question: |
  Confirm jurisdiction
subquestion: |
  ${  users[0].name.full()  } and ${  users[1].name.full()  }
fields:
  - "Have either or both  lived in Massachusetts for at least one year?": massachusetts_residency
    datatype: yesnoradio
  #- "Did the cause of the breakdown of the marriage occur in Massachusetts?": breakdown_in_massachusetts
    #datatype: yesnoradio
    #showif:
        #code: |
          #massachusetts_residency == False
---
id: Divorce type
question: |
  Divorce type 
subquestion: |
  ### Joint petition for divorce under [G.L. c. 208, § 1 A](https://malegislature.gov/Laws/GeneralLaws/PartII/TitleIII/Chapter208/Section1a)
  
  Do ${  users[0].name.full()  } and ${  users[1].name.full()  } both agree that you want to:
 
  1. get divorced  
  2. file together and
  3. file complete, notorized separation agreement at the time of filing or within 90 days thereafter

yesno: petition_is_joint
#add helptext about the reasons one might choose 1B or 1A - mass.gov has useful information about this
---
id: Agreement status
question: |
  Agreement on major issues
subquestion: |
  Do ${  users[0].name.full()  } and ${  users[1].name.full()  } agree on how to resolve the major issues, such as property division, child custody, and child support?
fields: 
  - "We agree on the major issues": separation_agreement_reached
    datatype: yesnoradio
  - "We have already prepared a detailed written agreement": separation_agreement_documented
    datatype: yesnoradio
    show if: separation_agreement_reached
---
id: Separation agreement format
question: |
  Separation agreement format
subquestion: |
  Anyone filing a joint petition for divorce must file a separation agreement within 90 days of initial filing. The separation agreement must be notorized and should completely address all major issues such as property division, child custody, and child support. It is highly encouraged that you submit a complete, notorized agreement with initial filing. 
  
fields: 
  - "How would you like to file your separation agreement?": separation_agreement_format
    input type: radio
    choices: 
      - "Upload my complete, notorized separation agreement here": upload
        show if: separation_agreement_documented
      - "File my complete, notorized separation agreement with the registry later" : wait
      - "Create a separation agreement using this interview tool.": interview
        show if: separation_agreement_documented == False
#- "Use ODR product": Link them there first? How are we connecting to API?
---
id: Relationship background
question: |
  Relationship background
subquestion: |
  ${  users[0].name.full()  } and ${  users[1].name.full()  }
fields:
  - "When were you married?": marriage_date
    datatype: date
  - "Where were you married? (City, State or City, Country if outside USA)": marriage_location
    maxlength: 54
  - "When did the marriage breakdown occur?": marriage_breakdown_date
    datatype: date
  - "Briefly explain what caused the marriage breakdown": marriage_breakdown_justification
    input type: area
    maxlength: 810
#Need to include guidance on how to write this portion of the affidavit effectively. "Irreconcilabile differences have led to an irretrievable breakdown of the marriage."
---
id: Living arrangements
question: |
  Living arrangements
fields: 
  - "Do ${  users[0]  } and ${  users[1]  } currently live together?": live_together
    datatype: radio
    choices: 
      - We live together: True
      - We live in separate households: False
  - "When did you last live together?": last_living_together_date
    datatype: date
    show if:
      variable: live_together
      is: False
---
