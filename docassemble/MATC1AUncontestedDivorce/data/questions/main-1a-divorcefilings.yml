  - "Petitioners2 is plaintiff": petitioners2_is_plaintiff
    datatype: yesno
  - "Petitioners2 is defendant": petitioners2_is_defendant
    datatype: yesno
  - "Petitioners2 name last at birth": petitioners2_name_last_at_birth
    maxlength: 26
  - "Petitioners2 is female": petitioners2_is_female
    datatype: yesno
  - "Petitioners2 is male": petitioners2_is_male
    datatype: yesno
  - "Petitioners2 ssn": petitioners2_ssn
    maxlength: 23
---
id: Miscellaneous
question: |
  Miscellaneous
fields:
  - "Judgment divorce": judgment_divorce
    datatype: yesno
  - "Judgment annulment": judgment_annulment
    datatype: yesno
  - "Date of judgement": judgement_date
