    required: False
    help: |
      A docket number is assigned after a case is filed.
---
id: user_and_other_party_names
sets:
  - user_and_other_party_names
question: |
  Party names
subquestion: |
  Use legal names as they appear on court documents. If you do not know
  the other party's information yet, you can leave those fields blank.
fields:
