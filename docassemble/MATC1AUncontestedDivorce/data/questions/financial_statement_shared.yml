---
modules:
  - docassemble.base.util
---
code: |
  from docassemble.base.util import defined, log, value

  def fs_log(message, level="debug"):
    global debug_log
    log(f"[fs] {message}", level)
    if not defined("debug_log"):
      debug_log = []
    debug_log.append(message)

  def to_weekly(amount, cadence):
    if amount is None:
      return 0
    try:
      value = float(amount)
    except Exception:
      return 0
    if cadence == "weekly":
      return value
    if cadence == "biweekly":
      return value / 2
    if cadence == "semimonthly":
      return value / 2.15
    if cadence == "monthly":
      return value / 4.3
    if cadence == "annual":
      return value / 52
    return value
---
variable name: cadence_choices
data:
  - [weekly, "Weekly"]
  - [biweekly, "Every 2 weeks"]
  - [semimonthly, "Twice per month"]
  - [monthly, "Monthly"]
  - [annual, "Yearly"]
---
variable name: other_asset_type_choices
data:
  - [checking, "Checking account"]
  - [savings, "Savings account"]
  - [cash, "Cash on hand"]
  - [cd, "Certificate of deposit"]
  - [credit_union, "Credit union account"]
  - [escrow, "Funds held in escrow"]
  - [stocks, "Stocks"]
  - [bonds, "Bonds"]
  - [bond_funds, "Bond funds"]
  - [notes_held, "Notes held"]
  - [brokerage_cash, "Cash in brokerage account"]
  - [money_market, "Money market account"]
  - [us_savings_bonds, "U.S. savings bonds"]
  - [ira, "IRA"]
  - [keough, "Keough"]
  - [profit_sharing, "Profit sharing"]
  - [deferred_comp, "Deferred compensation"]
  - [other_retirement, "Other retirement plan"]
  - [annuity, "Annuity"]
  - [life_insurance_cash, "Life insurance cash value"]
  - [judgments_liens, "Judgments or liens"]
  - [pending_inheritance, "Pending legacies or inheritances"]
  - [jewelry, "Jewelry"]
  - [safe_deposit, "Safe or safe deposit box contents"]
  - [firearms, "Firearms"]
  - [collections, "Collections"]
  - [tools_equipment, "Tools or equipment"]
  - [crops_livestock, "Crops or livestock"]
  - [home_furnishings, "Home furnishings"]
  - [arts_antiques, "Arts and antiques"]
  - [other, "Other (specify)"]
---
objects:
  - motor_vehicles: DAList.using(object_type=DAObject, complete_attribute="complete")
  - pensions: DAList.using(object_type=DAObject, complete_attribute="complete")
  - other_assets: DAList.using(object_type=DAObject, complete_attribute="complete")
  - liabilities: DAList.using(object_type=DAObject, complete_attribute="complete")
  - schedule_a_expenses: DAList.using(object_type=DAObject, complete_attribute="complete")
  - schedule_b_expenses: DAList.using(object_type=DAObject, complete_attribute="complete")
---
code: |
  if not defined("debug_log"):
    debug_log = []
