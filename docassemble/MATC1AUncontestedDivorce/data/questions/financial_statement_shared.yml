---
id: fs_intro
continue button field: fs_intro
question: |
  Massachusetts Financial Statement
subquestion: |
  This interview walks you through the Massachusetts Probate and Family
  Court financial statement step by step. At the end, you will have a
  completed PDF ready to print, sign, and file.

  The form covers six areas:

  1. **Personal information** and employment
  2. **Income** — wages, benefits, and other sources
  3. **Deductions** — taxes, insurance, and withholdings
  4. **Expenses** — housing, transportation, and daily costs
  5. **Assets** — property, vehicles, and accounts
  6. **Liabilities** — debts and obligations

  ${ collapse_template(fs_what_to_gather) }

  Your progress is **saved automatically**. You can close the browser and
  return later to pick up where you left off.

  Estimates are fine if you do not have exact figures. The court expects
  good-faith numbers, not perfection.
---
template: fs_what_to_gather
subject: |
  What to have ready
content: |
  Gathering these items before you begin will make the process faster:

  - **Pay stubs** from the last 4 weeks (or benefit award letters)
  - **Most recent tax return** and W-2s
  - **Recurring bills** — rent/mortgage, utilities, insurance premiums
  - **Account statements** — bank, retirement, and investment accounts
  - **Debt statements** — credit cards, loans, and other obligations
  - **Vehicle information** — make, model, and loan balance
  - **Property records** — assessed value, mortgage balance

  You do not need all of these to get started. You can leave fields blank
  and return to fill them in later.
---
id: income_above_threshold
question: |
  Which financial statement form applies to you?
subquestion: |
  Massachusetts uses two versions of the financial statement:

  - **Short form** — for gross annual income **under $75,000**
  - **Long form** — for gross annual income **$75,000 or more**

  Gross annual income means your total income from all sources before
  taxes over the last 12 months — wages, tips, benefits, rental income,
  investments, and anything else.

  If you are not sure, your best estimate is fine. You will enter detailed
  income amounts later in the interview.
fields:
  - Is your gross annual income $75,000 or more?: income_above_threshold
    datatype: yesnoradio
    help: |
      If your total household income from all sources is $75,000 or more
      per year before taxes, select "Yes." Otherwise select "No."
---
code: |
  if income_above_threshold:
    gross_annual_income = 75000
  else:
    gross_annual_income = 74999
---
id: docket_number
question: |
  Docket number
subquestion: |
  If the court has already assigned a docket number, enter it here.
  Otherwise, you can leave this blank.
fields:
