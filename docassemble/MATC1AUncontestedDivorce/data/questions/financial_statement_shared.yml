subquestion: |
  Include any health coverage you currently have.
  If you are covered through someone else, list the provider name.
fields:
  - Do you have health insurance coverage?: user_has_health_insurance
    datatype: yesno
  - Name of health insurance provider: user_health_insurance_provider
    show if:
