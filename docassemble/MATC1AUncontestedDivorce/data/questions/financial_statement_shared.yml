  Here is your calculated gross weekly income. The court form uses
  weekly amounts, so all values have been converted.

  **Total gross weekly income:** ${ currency(income_total_weekly) }

  % if defined('income_self_employment_weekly') and income_self_employment_weekly:
  Includes self-employment income: ${ currency(income_self_employment_weekly) }/week
  % endif
  % if defined('income_rental_weekly') and income_rental_weekly:
  Includes rental income: ${ currency(income_rental_weekly) }/week
  % endif

  If something looks wrong, use the **Back** button to make corrections.
---
code: |
  fs_log("Calculating weekly income totals.")
  income_total_weekly = float(income_list.total(times_per_year=52))

  if defined("schedule_a_weekly_business_income"):
    income_self_employment_weekly = float(schedule_a_weekly_business_income)
  else:
    income_self_employment_weekly = 0.0

  if defined("schedule_b_weekly_rental_income"):
    income_rental_weekly = float(schedule_b_weekly_rental_income)
  else:
    income_rental_weekly = 0.0

  income_total_weekly = (
    float(income_total_weekly)
    + float(income_self_employment_weekly)
    + float(income_rental_weekly)
  )
---
id: confirm_no_income
if: income_total_weekly == 0
continue button field: confirm_no_income
question: |
  Confirm no income
subquestion: |
  You entered $0 for all income sources.

  If this is correct, choose "Yes" to continue. If not, click "Back" to add income.
fields:
  - Yes, I have no income to report: confirm_no_income
    datatype: yesno
---
id: fs_review
continue button field: fs_review
question: |
  Review your financial statement
subquestion: |
  Take a moment to check that your information is correct before
  generating the final document. You can edit any section by clicking
  the pencil icon.

  **Form type:** ${ "Short form (income under $75,000)" if financial_form_type == "short" else "Long form (income $75,000 or more)" }
review:
  - label: Edit personal information
    fields:
      - users[0].name.first
      - users[0].birthdate
      - user_ssn
      - user_has_children
      - children_living_with_user_count
    button: |
      **Personal information**

      Name: ${ users[0] }
      % if defined('users[0].birthdate'):
      Date of birth: ${ users[0].birthdate }
      % endif
      % if defined('user_has_children') and user_has_children:
      Children living with you: ${ children_living_with_user_count }
      % endif
  - label: Edit contact and address
    fields:
      - users[0].phone_number
      - users[0].address.address
