id: fs_download
event: fs_download
question: |
  Your financial statement is ready
subquestion: |
  ${ al_user_bundle.download_list_html() }

  ${ action_button_html(url_action('review_fs'), label='Edit answers', color='info', size='sm') }

  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }

  ${ collapse_template(fs_next_steps) }

  ${ collapse_template(fs_attachment_checklist) }
progress: 100
---
template: fs_next_steps
subject: |
  What to do next
content: |
  1. **Print** your financial statement and any schedules.
  2. **Sign** the certification page (if you have not already).
  % if financial_form_type == "long":
  3. **Get the statement notarized** before filing. The long form requires
     notarization under Massachusetts court rules.
  % endif
  4. **Attach** supporting documents (pay stubs, tax returns, etc.).
  5. **File** the original with the court clerk's office and keep a copy for
     your records.
  6. **Serve** a copy on the other party or their attorney.
---
template: fs_attachment_checklist
subject: |
  Documents to attach
content: |
  The court may require supporting documents with your financial statement.
  Gather the following if available:

  - Most recent **pay stubs** (at least 4 weeks)
  - Most recent **federal tax return** (including W-2s)
  - Proof of **child care** or **medical costs** (if claimed)
  % if defined('has_self_employment_income') and has_self_employment_income:
  - **Business records** (receipts, P&L statement) for Schedule A
  % endif
  % if defined('has_rental_income') and has_rental_income:
  - **Rental records** (lease agreements, expense receipts) for Schedule B
  % endif
---
id: motor_vehicles
question: |
  Motor vehicles
subquestion: |
  Include cars, trucks, motorcycles, and other motor vehicles you own.
fields:
  - Do you have motor vehicles to list?: motor_vehicles.there_are_any
    datatype: yesno
---
id: motor_vehicle_item
generic object: motor_vehicles
question: |
  Motor vehicle details
subquestion: |
  Enter the details you have. Estimates are fine if exact values are
  not available.
fields:
  - Type: motor_vehicles[i].vehicle_type
    required: False
    help: |
      Car, truck, SUV, motorcycle, etc.
  - Make: motor_vehicles[i].make
    required: False
    css class: col-md-4
  - Model: motor_vehicles[i].model
    required: False
    css class: col-md-4
  - Year of purchase: motor_vehicles[i].purchase_year
    datatype: integer
    required: False
    css class: col-md-4
  - Purchase price: motor_vehicles[i].purchase_price
    datatype: currency
    required: False
  - Fair market value: motor_vehicles[i].fair_market_value
    datatype: currency
    required: False
    help: |
      What the vehicle would sell for today. You can check Kelley Blue
      Book (kbb.com) or similar sites for an estimate.
  - Outstanding loan: motor_vehicles[i].outstanding_loan
    datatype: currency
    required: False
    help: |
      The remaining balance on any auto loan for this vehicle.
  - Equity: motor_vehicles[i].equity
    datatype: currency
    required: False
    help: |
      Fair market value minus the outstanding loan balance.
---
code: |
  motor_vehicles[i].complete = True
---
id: motor_vehicles_more
question: |
  Do you have another motor vehicle to add?
subquestion: |
  If you have listed all vehicles, choose "No."
fields:
  - Do you have another motor vehicle to add?: motor_vehicles.there_is_another
    datatype: yesno
---
id: pensions
question: |
  Pensions and retirement plans
subquestion: |
  Include 401(k)s, IRAs, pensions, and other retirement accounts.
fields:
  - Do you have pensions or retirement plans to list?: pensions.there_are_any
    datatype: yesno
---
id: pension_item
generic object: pensions
question: |
  Pension or retirement plan
subquestion: |
  Enter the most recent values you have. Check your latest statement
  or log in to your account for current balances.
fields:
  - Institution: pensions[i].institution
    required: False
    help: |
      The company that manages the plan — for example, Fidelity, Vanguard,
      TIAA, or your employer's name.
  - Account number: pensions[i].account_number
    required: False
  - Listed beneficiary: pensions[i].beneficiary
    required: False
  - Defined benefit plan amount: pensions[i].defined_benefit_amount
    datatype: currency
    required: False
    help: |
      A defined benefit plan promises a fixed monthly payment at retirement,
      based on salary and years of service. Enter the projected monthly
      benefit if known.
  - Defined contribution plan amount: pensions[i].defined_contribution_amount
    datatype: currency
    required: False
    help: |
      A defined contribution plan (401(k), 403(b), IRA) has a current
      account balance. Enter the most recent balance.
---
code: |
  pensions[i].complete = True
---
id: pensions_more
question: |
  Do you have another pension or retirement plan to add?
subquestion: |
  If you have listed all plans, choose "No."
fields:
  - Do you have another pension or retirement plan to add?: pensions.there_is_another
    datatype: yesno
---
id: other_assets
question: |
  Other assets
subquestion: |
  List other assets you own that are not real estate or vehicles.
fields:
  - Do you have other assets to list?: other_assets.there_are_any
    datatype: yesno
---
id: other_asset_item
generic object: other_assets
question: |
  Other asset details
subquestion: |
  You can include notes to clarify ownership or the type of asset.
fields:
