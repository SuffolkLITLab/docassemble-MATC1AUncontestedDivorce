code: |
  from docassemble.base.util import defined, log, value

  def fs_log(message, level="debug"):
    global debug_log
    log(f"[fs] {message}", level)
    if not defined("debug_log"):
      debug_log = []
    debug_log.append(message)

  def to_weekly(amount, cadence):
    if amount is None:
      return 0
    try:
      value = float(amount)
    except Exception:
      return 0
    if cadence == "weekly":
      return value
    if cadence == "biweekly":
      return value / 2
    if cadence == "semimonthly":
      return value / 2.15
    if cadence == "monthly":
      return value / 4.3
    if cadence == "annual":
      return value / 52
    return value

  def cadence_to_times_per_year(cadence):
    if cadence == "weekly":
      return 52
    if cadence == "biweekly":
      return 26
    if cadence == "semimonthly":
      return 24
    if cadence == "monthly":
      return 12
    if cadence == "annual":
      return 1
    return 52

  def fs_safe_float(amount):
    try:
      return float(amount)
    except Exception:
      return 0.0

  def fs_item_value(item, attr_name):
    var_name = f"{item.instanceName}.{attr_name}"
    if defined(var_name):
      return value(var_name)
    return None

  def fs_sum_list_attr(items, attr_name):
    total = 0.0
    try:
      for item in items:
        item_value = fs_item_value(item, attr_name)
        if item_value not in (None, ""):
          total += fs_safe_float(item_value)
    except Exception:
      return 0.0
    return total

  def _other_assets_total_by_type(asset_type_key):
    total = 0.0
    try:
      for item in other_assets:
        if fs_item_value(item, "asset_type") == asset_type_key:
          item_value = fs_item_value(item, "current_balance")
          if item_value not in (None, ""):
            total += fs_safe_float(item_value)
    except Exception:
      return 0.0
    return total
