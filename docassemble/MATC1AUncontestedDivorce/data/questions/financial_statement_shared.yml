---
template: schedule_explanation
subject: |
  What are Schedule A and Schedule B?
content: |
  **Schedule A** covers self-employment and business income. If you do
  freelance work, gig work, run a small business, or have any income
  where you are not a W-2 employee, you should answer "Yes" to the
  self-employment question.

  **Schedule B** covers rental income from property you own. If you
  collect rent from a house, apartment, or room, answer "Yes" to the
  rental income question.
