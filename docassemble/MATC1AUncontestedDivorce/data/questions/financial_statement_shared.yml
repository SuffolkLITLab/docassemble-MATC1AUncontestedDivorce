  * ${ section }
  % endfor
  % if defined("debug_log") and debug_log:
  ---
  ### Debug log (last 5)
  % for entry in debug_log[-5:]:
  - ${ entry }
  % endfor
  % endif
---
id: fs_download
event: fs_download
question: |
  Download your financial statement
subquestion: |
  Your financial statement is ready. You can download the forms below.

  ${ action_button_html(url_action('review_fs'), label='Edit answers', color='info') }

  ${ al_user_bundle.download_list_html() }

  ${ al_user_bundle.send_button_html(show_editable_checkbox=False) }

  ${ collapse_template(fs_attachment_checklist, collapsed=False) }
progress: 100
---
template: fs_attachment_checklist
content: |
  **Attachment checklist**
  - Recent pay stubs or benefit statements
  - Proof of child care or medical costs (if applicable)
  - Business records for Schedule A
  - Rental records for Schedule B
---
id: motor_vehicles
question: |
  Motor vehicles
subquestion: |
  Include cars, trucks, motorcycles, and other motor vehicles you own.
fields:
  - Do you have motor vehicles to list?: motor_vehicles.there_are_any
    datatype: yesno
---
id: motor_vehicle_item
generic object: motor_vehicles
question: |
  Motor vehicle details
subquestion: |
  Enter the best information you have. Estimates are fine if exact values
  are not available.
fields:
  - Type: motor_vehicles[i].vehicle_type
    required: False
  - Make: motor_vehicles[i].make
    required: False
  - Model: motor_vehicles[i].model
    required: False
  - Purchase price: motor_vehicles[i].purchase_price
    datatype: currency
    required: False
  - Year of purchase: motor_vehicles[i].purchase_year
    datatype: integer
    required: False
  - Fair market value: motor_vehicles[i].fair_market_value
    datatype: currency
    required: False
  - Outstanding loan: motor_vehicles[i].outstanding_loan
    datatype: currency
    required: False
  - Equity: motor_vehicles[i].equity
    datatype: currency
    required: False
---
code: |
  motor_vehicles[i].vehicle_type
  motor_vehicles[i].make
  motor_vehicles[i].model
  motor_vehicles[i].purchase_price
  motor_vehicles[i].purchase_year
  motor_vehicles[i].fair_market_value
  motor_vehicles[i].outstanding_loan
  motor_vehicles[i].equity
  motor_vehicles[i].complete = True
---
id: motor_vehicles_more
question: |
  Do you have another motor vehicle to add?
subquestion: |
  If you have listed all vehicles, choose "No."
fields:
  - Do you have another motor vehicle to add?: motor_vehicles.there_is_another
    datatype: yesno
---
id: pensions
question: |
  Pensions and retirement plans
subquestion: |
  Include 401(k)s, IRAs, pensions, and other retirement accounts.
fields:
  - Do you have pensions or retirement plans to list?: pensions.there_are_any
    datatype: yesno
---
id: pension_item
generic object: pensions
question: |
  Pension or retirement plan
subquestion: |
  Enter the most recent values you have access to.
fields:
  - Institution: pensions[i].institution
    required: False
  - Account number: pensions[i].account_number
    required: False
  - Listed beneficiary: pensions[i].beneficiary
    required: False
  - Defined benefit plan amount: pensions[i].defined_benefit_amount
    datatype: currency
    required: False
  - Defined contribution plan amount: pensions[i].defined_contribution_amount
    datatype: currency
    required: False
---
code: |
  pensions[i].institution
  pensions[i].account_number
  pensions[i].beneficiary
  pensions[i].defined_benefit_amount
  pensions[i].defined_contribution_amount
  pensions[i].complete = True
---
id: pensions_more
question: |
  Do you have another pension or retirement plan to add?
subquestion: |
  If you have listed all plans, choose "No."
fields:
  - Do you have another pension or retirement plan to add?: pensions.there_is_another
    datatype: yesno
