    code: |
      other_asset_type_choices
  - Description or notes: other_assets[i].description
    required: False
  - Institution: other_assets[i].institution
    required: False
  - Account number: other_assets[i].account_number
    required: False
  - Listed beneficiary: other_assets[i].beneficiary
    required: False
  - Current balance/value: other_assets[i].current_balance
    datatype: currency
    required: False
---
code: |
  other_assets[i].complete = True
---
id: other_assets_more
question: |
  Do you have another asset to add?
subquestion: |
  If you have listed all assets, choose "No."
fields:
  - Do you have another asset to add?: other_assets.there_is_another
    datatype: yesno
---
id: liabilities
question: |
  Liabilities
subquestion: |
  Include credit cards, loans, tax debt, and other outstanding obligations.
fields:
  - Do you have liabilities to list?: liabilities.there_are_any
    datatype: yesno
---
id: liability_item
generic object: liabilities
question: |
  Liability details
subquestion: |
  Enter what you know about this debt. Estimates are fine if you do
  not have exact figures.
fields:
  - Creditor: liabilities[i].creditor
    required: False
    help: |
      The person or company you owe money to — for example, a bank,
      credit card company, or the IRS.
  - Nature of debt: liabilities[i].debt_type
    required: False
    help: |
      Examples: credit card, student loan, auto loan, medical bill,
      tax debt, personal loan.
  - Date incurred: liabilities[i].date_incurred
    required: False
    help: |
      The approximate date the debt was taken on.
  - Total amount due: liabilities[i].amount_due
    datatype: currency
    required: False
  - Weekly payment: liabilities[i].weekly_payment
    datatype: currency
    required: False
    help: |
      Your current weekly payment toward this debt. If you pay monthly,
      divide by 4.3.
---
code: |
  liabilities[i].complete = True
---
id: liabilities_more
question: |
  Do you have another liability to add?
subquestion: |
  If you have listed all liabilities, choose "No."
fields:
  - Do you have another liability to add?: liabilities.there_is_another
    datatype: yesno
