    min: 0
    show if:
      variable: user_has_children
      is: True
  - note: |
      #### Social Security number
      This is optional. The court form has a field for it, but you are not
      required to provide it.
  - Social Security number: user_ssn
    required: False
---
code: |
  if defined("user_has_children") and not user_has_children:
    children_living_with_user_count = 0
---
