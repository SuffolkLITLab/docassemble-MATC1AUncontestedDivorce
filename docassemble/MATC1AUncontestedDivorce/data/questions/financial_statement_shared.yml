---
code: |
  fs_log("income_totals")
  income_total_weekly = income_list.total(times_per_year=52)

  if defined("schedule_a_weekly_business_income"):
    income_self_employment_weekly = schedule_a_weekly_business_income
  else:
    income_self_employment_weekly = 0

  if defined("schedule_b_weekly_rental_income"):
    income_rental_weekly = schedule_b_weekly_rental_income
  else:
    income_rental_weekly = 0

  income_total_weekly = (
    income_total_weekly
    + income_self_employment_weekly
    + income_rental_weekly
  )
---
