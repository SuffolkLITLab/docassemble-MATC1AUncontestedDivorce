      **Contact and address**

      % if defined('users[0].phone_number') and users[0].phone_number:
      Phone: ${ users[0].phone_number }
      % endif
      Address: ${ users[0].address.on_one_line() }
  - label: Edit employment
    fields:
      - user_employer_name
      - user_job_title
    button: |
      **Employment**

      % if defined('user_employer_name') and user_employer_name:
      Employer: ${ user_employer_name }
      % endif
      % if defined('user_job_title') and user_job_title:
      Title: ${ user_job_title }
      % endif
      % if (not defined('user_employer_name') or not user_employer_name) and (not defined('user_job_title') or not user_job_title):
      *None listed*
      % endif
  - label: Edit income
    fields:
      - income_list.revisit
    button: |
      **Income**

      Gross weekly income: ${ currency(income_total_weekly) }
      % if defined('income_self_employment_weekly') and income_self_employment_weekly:
      Self-employment (weekly): ${ currency(income_self_employment_weekly) }
      % endif
      % if defined('income_rental_weekly') and income_rental_weekly:
      Rental income (weekly): ${ currency(income_rental_weekly) }
      % endif
  - label: Edit court and parties
    fields:
      - docket_number
      - other_parties[0].name.first
    button: |
      **Court and parties**

      Court: ${ trial_court.division if hasattr(trial_court, 'division') else '' }
      % if defined('docket_number') and docket_number:
      Docket: ${ docket_number }
      % endif
      Other party: ${ other_parties[0] }
---
