      is: True
    required: False
---
id: financial_cadence_default
question: |
  How often are you paid?
subquestion: |
  Most of your income and expense amounts will use this schedule. You can
  override it for individual items later if needed.

  For example, if you are paid every two weeks and your check is $900,
  select "Every 2 weeks" and enter 900 when asked for income amounts.
fields:
  - Pay frequency: financial_cadence_default
    input type: radio
    code: |
      cadence_choices
    default: weekly
    help: |
      Pick the schedule that matches your main paycheck or most of your bills.
---
reconsider: True
code: |
  fs_default_times_per_year = cadence_to_times_per_year(financial_cadence_default)
---
id: fs_deductions_intro
continue button field: fs_deductions_intro
question: |
  Next: Deductions
subquestion: |
  Now we will ask about amounts deducted from your paycheck — taxes,
  insurance premiums, and other withholdings.

  If you have a **recent pay stub**, look for lines labeled "deductions"
  or "withholdings." Enter the amount for a single pay period.
---
id: fs_expenses_intro
continue button field: fs_expenses_intro
question: |
  Next: Weekly expenses
subquestion: |
  This section covers your regular household and personal expenses —
  housing, food, transportation, insurance, and other recurring costs.

  Enter the amount you typically pay each period. We will convert
  everything to weekly totals for the court form.
---
id: fs_assets_intro
continue button field: fs_assets_intro
question: |
  Next: Assets
subquestion: |
  Now we will collect information about what you own — real estate,
  vehicles, retirement accounts, bank accounts, and other property.

  You will also be asked about **counsel fees** (attorney costs) if
  applicable.

  Have your **account statements** and **property records** ready if
  possible. Estimates are fine if you do not have exact figures.
---
id: fs_liabilities_intro
continue button field: fs_liabilities_intro
question: |
  Next: Liabilities
subquestion: |
  Finally, we will ask about your debts and financial obligations —
  credit cards, loans, tax debt, and other amounts you owe.

  For each liability, you will enter the creditor name, amount owed,
  and your weekly payment.
---
id: fs_income_intro
continue button field: fs_income_intro
question: |
  Next: Income
subquestion: |
  Now we will ask about your income sources — wages, benefits,
  investments, and any other money you receive.

  You will:

  - Select which income types apply to you
  - Enter amounts for each source
  - Indicate whether you have self-employment or rental income

  All amounts will be converted to weekly totals for the court form.

  If you have a **pay stub** handy, it will help with this section.
---
id: fs_income_sources
generic object: ALIncomeList
question: |
  Gross income sources
subquestion: |
  Select all income sources you receive.

  You will enter amounts and how often you receive them. If a category is
  missing, choose "Other income."
fields:
  - no label: x.selected_types
    datatype: checkboxes
    code: |
      fs_income_terms_ordered
---
generic object: ALIncomeList
code: |
  x.selected_types
  x.move_checks_to_list(selected_terms=fs_income_terms)
  x.moved = True
---
id: fs_income_item
generic object: ALIncomeList
question: |
  Income details
subquestion: |
  Tell us about your ${ ordinal(i) } income. Enter the amount for a single
  pay period and choose how often you receive it. We will convert everything
  to a weekly amount for the court form.

  **Example:** If you receive $300 monthly, enter 300 and choose "Monthly."
fields:
  - Type of income: x[i].source
    code: |
      fs_income_terms_ordered
    default: other
  - Other income type: x[i].source
    show if:
      variable: x[i].source
      is: other
  - Amount: x[i].value
    datatype: currency
  - Use my default cadence (${ financial_cadence_default }): x[i].use_default_cadence
    datatype: yesno
    default: True
  - How often do you receive this income?: x[i].times_per_year
    input type: radio
    code: |
      times_per_year_list
    default: ${ fs_default_times_per_year }
    show if:
      variable: x[i].use_default_cadence
      is: False
validation code: |
  x[i].display_name = fs_income_terms.get(x[i].source, x[i].source)
  if hasattr(x[i], "use_default_cadence") and x[i].use_default_cadence:
    x[i].times_per_year = fs_default_times_per_year
---
generic object: ALIncomeList
code: |
  x.moved
  for income_item in x.elements:
    income_item.complete
  x.revisit = True
  x.gathered = True
---
generic object: ALIncomeList
table: x.table
rows: x
columns:
  - Type: |
      row_item.display_name if hasattr(row_item, "display_name") else row_item.source
  - Amount per month: |
      currency(row_item.total(times_per_year=12))
edit:
  - source
  - value
  - times_per_year
---
