id: income_totals
continue button field: income_totals
question: |
  Income summary
subquestion: |
  We will convert your amounts to weekly values for the financial statement.

  Total gross weekly income (current): ${ currency(income_total_weekly) }
---
code: |
  fs_log("Calculating weekly income totals.")
  income_base_pay_weekly = to_weekly(value("income_base_pay_amount"), financial_cadence_default)
  income_overtime_weekly = to_weekly(value("income_overtime_amount"), financial_cadence_default)
  income_part_time_weekly = to_weekly(value("income_part_time_amount"), financial_cadence_default)
  income_tips_weekly = to_weekly(value("income_tips_amount"), financial_cadence_default)
  income_commissions_weekly = to_weekly(value("income_commissions_amount"), financial_cadence_default)
  income_dividends_weekly = to_weekly(value("income_dividends_amount"), financial_cadence_default)
  income_trusts_weekly = to_weekly(value("income_trusts_amount"), financial_cadence_default)
  income_pensions_weekly = to_weekly(value("income_pensions_amount"), financial_cadence_default)
  income_social_security_weekly = to_weekly(value("income_social_security_amount"), financial_cadence_default)
  income_disability_weekly = to_weekly(value("income_disability_amount"), financial_cadence_default)
  income_public_assistance_weekly = to_weekly(value("income_public_assistance_amount"), financial_cadence_default)
  income_support_received_weekly = to_weekly(value("income_support_received_amount"), financial_cadence_default)
  income_royalties_weekly = to_weekly(value("income_royalties_amount"), financial_cadence_default)
  income_household_contrib_weekly = to_weekly(value("income_household_contrib_amount"), financial_cadence_default)
  income_other_weekly = to_weekly(value("income_other_amount"), financial_cadence_default)

  if defined("schedule_a_weekly_business_income"):
    income_self_employment_weekly = schedule_a_weekly_business_income
  else:
    income_self_employment_weekly = 0

  if defined("schedule_b_weekly_rental_income"):
    income_rental_weekly = schedule_b_weekly_rental_income
  else:
    income_rental_weekly = 0

  income_total_weekly = (
    income_base_pay_weekly
    + income_overtime_weekly
    + income_part_time_weekly
    + income_self_employment_weekly
    + income_tips_weekly
    + income_commissions_weekly
    + income_dividends_weekly
    + income_trusts_weekly
    + income_pensions_weekly
    + income_social_security_weekly
    + income_disability_weekly
    + income_public_assistance_weekly
    + income_support_received_weekly
    + income_rental_weekly
    + income_royalties_weekly
    + income_household_contrib_weekly
    + income_other_weekly
  )
---
