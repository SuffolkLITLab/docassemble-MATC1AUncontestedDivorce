id: fs_intro
continue button field: fs_intro
question: |
  Financial Statement
subquestion: |
  This interview helps you prepare a Massachusetts financial statement.
  You will answer questions about your income, deductions, expenses, assets,
  and debts.

  **What you will do**
  - Enter amounts for one pay period or payment.
  - Choose how often you receive or pay each amount.
  - Check totals that the interview calculates for you.

  **What to gather (if available)**
  - Recent pay stubs or benefit statements
  - Recent bills or statements for recurring expenses
  - Account balances for assets and debts

  **Save your progress**
  Your work is saved as you go. You can return later to continue.

  **Tip:** Estimates are OK if you are not sure. Aim for your best, good-faith
  numbers so the court gets a clear picture.
---
id: gross_annual_income
question: |
  Gross annual income
subquestion: |
  Enter your total income before taxes for the last 12 months.

  **Include:** wages, tips, overtime, benefits, rental income, and other income.
  If you are not sure, give your best estimate.
fields:
  - I do not know my gross annual income: gross_annual_income_unknown
    datatype: yesno
  - Gross annual income: gross_annual_income
    datatype: currency
    min: 0
    show if:
      variable: gross_annual_income_unknown
      is: False
    help: |
      Use your best estimate if you are unsure.
  - Best estimate of gross annual income: gross_annual_income_estimate
    datatype: currency
    min: 0
    required: True
    show if:
      variable: gross_annual_income_unknown
      is: True
    help: |
      This estimate helps the court decide whether the short or long form applies.
---
code: |
  if defined("gross_annual_income_unknown") and gross_annual_income_unknown:
    gross_annual_income = value("gross_annual_income_estimate") or 0
