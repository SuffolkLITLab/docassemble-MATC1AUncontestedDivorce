---
modules:
  - docassemble.base.util
---
terms:
  F.I.C.A.: |
    Federal Insurance Contributions Act — the Social Security and
    Medicare tax withheld from your paycheck. Often labeled "FICA,"
    "SS," or "OASDI" on a pay stub.
  FICA: |
    Federal Insurance Contributions Act — the Social Security and
    Medicare tax withheld from your paycheck.
  fair market value: |
    What your property would likely sell for on the open market today,
    in a transaction between a willing buyer and willing seller.
  deferred compensation: |
    Income you have earned but have chosen to receive at a later date,
    often through an employer-sponsored plan such as a 457(b).
  defined benefit plan: |
    A retirement plan where your employer promises a specific monthly
    payment when you retire, based on salary and years of service.
    Traditional pensions are defined benefit plans.
  defined contribution plan: |
    A retirement plan where you (and sometimes your employer) contribute
    money that is invested on your behalf — for example, a 401(k),
    403(b), or IRA.
  equity: |
    The difference between what an asset is worth (fair market value) and
    what you still owe on it. For example, if your home is worth $300,000
    and your mortgage balance is $200,000, your equity is $100,000.
  PIT: |
    Principal, Interest, and Taxes — the main components of a typical
    mortgage payment.
  TAFDC: |
    Transitional Aid to Families with Dependent Children — a
    Massachusetts public assistance program.
  SNAP: |
    Supplemental Nutrition Assistance Program — federal food assistance,
    sometimes called "food stamps."
  gross income: |
    Your total income before any taxes or deductions are taken out.
  net income: |
    Your take-home pay — gross income minus all deductions.
  cadence: |
    How often you receive a payment or paycheck. Also called pay frequency.
  BBO number: |
    Board of Bar Overseers registration number — a Massachusetts attorney
    license identifier.
---
code: |
  from docassemble.base.util import defined, log, value

  def fs_log(message, level="debug"):
    global debug_log
    log(f"[fs] {message}", level)
    if not defined("debug_log"):
      debug_log = []
    debug_log.append(message)

  def to_weekly(amount, cadence):
    if amount is None:
      return 0
    try:
      value = float(amount)
    except Exception:
      return 0
    if cadence == "weekly":
      return value
    if cadence == "biweekly":
      return value / 2
    if cadence == "semimonthly":
      return value / 2.15
    if cadence == "monthly":
      return value / 4.3
    if cadence == "annual":
      return value / 52
    return value

  def cadence_to_times_per_year(cadence):
    if cadence == "weekly":
      return 52
    if cadence == "biweekly":
      return 26
    if cadence == "semimonthly":
      return 24
    if cadence == "monthly":
      return 12
    if cadence == "annual":
      return 1
    return 52
